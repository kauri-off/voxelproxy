name: Test MSI

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: test-msi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'build-msi') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'build-msi'))
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build MSI
        run: cargo packager --release --formats wix

      - name: Upload MSI
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: voxelproxy-msi-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}
          path: target/release/*_ru-RU.msi
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          echo "MSI: ${{ steps.upload.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: test-msi
          message: |
            Тестовый MSI для `${{ github.event.pull_request.head.sha }}`: ${{ steps.upload.outputs.artifact-url }}
