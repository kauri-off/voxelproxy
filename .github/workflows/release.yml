name: Rust Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build MSI
        env:
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
        run: cargo packager --release --formats wix

      - name: Extract version
        id: version
        shell: bash
        run: |
          ver=$(grep '^version =' Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          echo "version=$ver" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: target/release/*_ru-RU.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
